version: '3.8'

services:
  # Banco de dados (SQLite não precisa de container, mas incluído para PostgreSQL opcional)
  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: fraga_lanches
  #     POSTGRES_USER: fraga
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U fraga"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis para sessões/cache (opcional)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # API Gateway (ponto de entrada único)
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "2999:2999"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN}
      - MERCADO_PAGO_WEBHOOK_SECRET=${MERCADO_PAGO_WEBHOOK_SECRET}
    depends_on:
      - auth
      - menu
      - order
      - client
      - delivery
      - notification
      - report
      - review
      - payment
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Auth Service
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Menu Service
  menu:
    build:
      context: .
      dockerfile: services/menu/Dockerfile
    expose:
      - "3001"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Order Service
  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    expose:
      - "3002"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Client Service
  client:
    build:
      context: .
      dockerfile: services/client/Dockerfile
    expose:
      - "3003"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Delivery Service
  delivery:
    build:
      context: .
      dockerfile: services/delivery/Dockerfile
    expose:
      - "3004"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Notification Service (WebSocket + SSE)
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    expose:
      - "3005"
      - "3001"
    environment:
      - PORT=3000
      - WS_PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Report Service
  report:
    build:
      context: .
      dockerfile: services/report/Dockerfile
    expose:
      - "3006"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Review Service
  review:
    build:
      context: .
      dockerfile: services/review/Dockerfile
    expose:
      - "3007"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Payment Service
  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    expose:
      - "3008"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
      - JWT_SECRET=${JWT_SECRET}
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN}
      - MERCADO_PAGO_PUBLIC_KEY=${MERCADO_PAGO_PUBLIC_KEY}
      - MERCADO_PAGO_WEBHOOK_SECRET=${MERCADO_PAGO_WEBHOOK_SECRET}
      - DB_PATH=/data/fraga_lanches.db
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend Service (Static files + SPA fallback)
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    expose:
      - "3009"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FRONTEND_URL=https://fragalanches.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
  # postgres_data:
  # redis_data:

networks:
  default:
    name: fraga-network